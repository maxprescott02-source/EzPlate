<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap" rel="stylesheet">
<style>
:root, [data-theme="light"]{
  --bg:#F7F3EC; --surface:#FFFDF9; --field:#F2EADF;
  --text:#2A1F1A; --text2:#6B5D54; --muted:#756759; --border:#E8DFD3; --border2:#D9CDBD;
  --brand:#3E2C26; --accent:#B84E0C; --accent-weak:rgba(184,78,12,.10); --on-accent:#FFFFFF;
  --good:#2E6B44; --good-bg:rgba(46,107,68,.12);
  --warn:#A96206; --warn-bg:rgba(169,98,6,.12);
  --bad:#B03A2E; --bad-bg:rgba(176,58,46,.10);
  --elev:0 1px 2px rgba(62,44,38,.05),0 6px 18px rgba(62,44,38,.07);
}
[data-theme="dark"]{
  --bg:#191412; --surface:#241E1B; --field:#221C19;
  --text:#F3EDE5; --text2:#C9BBAF; --muted:#97897E; --border:#392F2A; --border2:#4A3E37;
  --brand:#F3EDE5; --accent:#F08A3C; --accent-weak:rgba(240,138,60,.16); --on-accent:#2A1F1A;
  --good:#6FBE8F; --good-bg:rgba(111,190,143,.16);
  --warn:#E2A54B; --warn-bg:rgba(226,165,75,.16);
  --bad:#E76D5C; --bad-bg:rgba(231,109,92,.16);
  --elev:none;
}
html,body{margin:0;background:var(--bg)}
body{font:15px/1.5 'Nunito Sans',system-ui,sans-serif;color:var(--text)}
a{color:var(--accent)}a:hover{color:var(--accent)}
button{transition:background .14s cubic-bezier(.2,.7,.3,1),filter .14s cubic-bezier(.2,.7,.3,1),transform .1s}
button:not([disabled]):active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main button[style*="width:100%"]:hover,button.mrow:hover,button.prow:hover,button.krow:hover,button.mrow2:hover,button.drow:hover{background:var(--field)}
aside button:hover{background:var(--accent-weak)}
button[style*="background:var(--accent)"]:not([disabled]):hover{filter:brightness(.92)}
button[style*="border-radius:999px"]:hover{background:var(--field)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div data-screen-label="Settings redesign (desktop)" style="min-height:100vh; background:rgba(24,16,14,.5); padding:48px 24px; box-sizing:border-box">
  <div style="max-width:760px; margin:0 auto; background:var(--bg); border:1px solid var(--border2); border-radius:16px; box-shadow:0 22px 56px rgba(0,0,0,.3); overflow:hidden">
    <div style="display:flex; align-items:center; gap:10px; padding:16px 24px; border-bottom:1px solid var(--border); background:var(--surface)">
      <h2 style="margin:0; font-size:17px; font-weight:800; color:var(--brand)">Settings</h2>
      <button type="button" onClick="{{ toggleTheme }}" style="margin-left:auto; border:0; background:none; color:var(--text2); font-size:15px; cursor:pointer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;vertical-align:-4px"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path></svg></button>
      <button type="button" aria-label="Close" style="border:0; background:none; color:var(--text2); font-size:20px; cursor:pointer; line-height:1">×</button>
    </div>
    <div style="display:grid; grid-template-columns:180px 1fr; min-height:420px">
      <nav style="border-right:1px solid var(--border); padding:16px 8px; display:flex; flex-direction:column; gap:2px" aria-label="Settings sections">
        <button type="button" style="text-align:left; border:0; border-radius:9px; padding:9px 12px; background:var(--accent-weak); color:var(--accent); font-weight:800; font-size:14px; cursor:pointer">General</button>
        <button type="button" style="text-align:left; border:0; border-radius:9px; padding:9px 12px; background:none; color:var(--text2); font-weight:700; font-size:14px; cursor:pointer">Invoices</button>
        <button type="button" style="text-align:left; border:0; border-radius:9px; padding:9px 12px; background:none; color:var(--text2); font-weight:700; font-size:14px; cursor:pointer">Lists</button>
        <button type="button" style="text-align:left; border:0; border-radius:9px; padding:9px 12px; background:none; color:var(--text2); font-weight:700; font-size:14px; cursor:pointer">Data</button>
        <button type="button" style="text-align:left; border:0; border-radius:9px; padding:9px 12px; background:none; color:var(--text2); font-weight:700; font-size:14px; cursor:pointer">Account</button>
        <button type="button" style="text-align:left; border:0; border-radius:9px; padding:9px 12px; background:none; color:var(--text2); font-weight:700; font-size:14px; cursor:pointer">Team</button>
        <button type="button" style="text-align:left; border:0; border-radius:9px; padding:9px 12px; background:none; color:var(--text2); font-weight:700; font-size:14px; cursor:pointer">About</button>
      </nav>
      <div style="padding:20px 24px">
        <div style="display:flex; align-items:flex-start; gap:16px; padding:14px 0; border-bottom:1px solid var(--border)">
          <div style="flex:1">
            <label style="font-size:15px; font-weight:700" for="tgt">Target food cost</label>
            <p style="margin:2px 0 0; font-size:13px; color:var(--text2)">Share of the sell price going to ingredients. Drives suggested prices and the target line.</p>
          </div>
          <div style="display:flex; align-items:center; gap:6px"><input id="tgt" type="number" value="40" style="width:64px; text-align:right; background:var(--field); border:1.5px solid var(--border); border-radius:10px; padding:9px 10px; font-family:ui-monospace,Menlo,monospace; font-size:15px; color:var(--text)"><span style="font-family:ui-monospace,Menlo,monospace; font-size:14px; color:var(--muted)">%</span></div>
        </div>
        <div style="display:flex; align-items:flex-start; gap:16px; padding:14px 0; border-bottom:1px solid var(--border)">
          <div style="flex:1">
            <span style="font-size:15px; font-weight:700">Theme</span>
            <p style="margin:2px 0 0; font-size:13px; color:var(--text2)">System follows your device.</p>
          </div>
          <div style="display:flex; border:1.5px solid var(--border); border-radius:10px; overflow:hidden">
            <button type="button" style="border:0; padding:8px 14px; background:none; color:var(--text2); font-weight:700; font-size:13px; cursor:pointer">Light</button>
            <button type="button" style="border:0; border-left:1px solid var(--border); padding:8px 14px; background:var(--field); color:var(--text); font-weight:800; font-size:13px; cursor:pointer">Dark</button>
            <button type="button" style="border:0; border-left:1px solid var(--border); padding:8px 14px; background:none; color:var(--text2); font-weight:700; font-size:13px; cursor:pointer">System</button>
          </div>
        </div>
        <div style="display:flex; align-items:flex-start; gap:16px; padding:14px 0">
          <div style="flex:1">
            <label style="font-size:15px; font-weight:700" for="ai">AI suggestions</label>
            <p style="margin:2px 0 0; font-size:13px; color:var(--text2)">The "What needs attention" briefing on the Dashboard. Off = no AI calls.</p>
          </div>
          <label style="position:relative; display:inline-block; width:44px; height:26px"><input id="ai" type="checkbox" checked style="opacity:0; width:0; height:0"><span style="position:absolute; inset:0; background:var(--accent); border-radius:999px"></span><span style="position:absolute; top:3px; right:3px; width:20px; height:20px; background:var(--on-accent); border-radius:50%"></span></label>
        </div>
      </div>
    </div>
    <div style="display:flex; justify-content:flex-end; padding:14px 24px; border-top:1px solid var(--border); background:var(--surface)">
      <button type="button" style="border:0; border-radius:12px; padding:11px 18px; background:var(--accent); color:var(--on-accent); font-weight:800; font-size:14px; cursor:pointer">Done</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:760},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { theme: null };
  applyTheme() {
    var t = this.state.theme || this.props.theme || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  }
  componentDidMount() { this.applyTheme(); }
  componentDidUpdate() { this.applyTheme(); }
  renderVals() {
    return {
      toggleTheme: () => {
        var cur = this.state.theme || this.props.theme || 'dark';
        this.setState({ theme: cur === 'dark' ? 'light' : 'dark' });
      }
    };
  }
}
</script>
</body>
</html>
