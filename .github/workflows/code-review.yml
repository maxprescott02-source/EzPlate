name: Code review

# ⚠️ THIS REVIEW COSTS REAL MONEY — ~$2 and ~15 minutes of Max's plan PER RUN, measured from the job
# logs on PR #56 ($2.08 and $2.23). Auth is OAuth, so it draws on his PERSONAL Claude subscription
# capacity, not a company card: a run that burns $2 is $2 of his own headroom for the month.
#
# ⚠️ THE MEASURED RECORD, 8 Aug 2026: roughly $20 spent, ONE real diff actually reviewed, ZERO bugs
# found. Half the runs never reviewed anything at all (see the anti-tamper guard below); the rest were
# docs. That is why this is no longer an automatic trigger. The free pre-push `code-review` agent is
# now the mandatory reviewer; THIS workflow is the paid second opinion, asked for deliberately.
on:
  # MANUAL. Run it from the Actions tab against a named PR when a diff genuinely warrants a second
  # reader. See the track_progress note further down for what this path can and cannot publish.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review (e.g. 61)'
        required: true
        type: string

  # LABEL. The primary mechanism. Add the `deep-review` label to a PR and exactly one review runs.
  # Removing and re-adding the label fires it again, which is the cheap way to re-request a review
  # after fixes — no code push, no workflow edit.
  #
  # `opened` and `ready_for_review` are DELIBERATELY GONE, and so is `synchronize` (dropped 6 Aug when
  # it was re-reviewing the whole diff on every fixup commit). Nothing here fires on its own any more.
  # ⚠️ SO THE OLD CLAIM "it cannot be skipped" IS DEAD. Reviews now happen because a human asked.
  # The guarantee that replaced it is the pre-push `code-review` agent, which is free and mandatory.
  pull_request:
    types: [labeled]
    #
    # `paths-ignore` WAS HERE AND HAS BEEN REMOVED — deliberately, not tidied away. It listed
    # '**.md', 'docs/**', 'skills/**', '.claude/**', '.vercelignore', '.gitignore' so that a
    # docs-only push could not cost $2, and it was written as a BLOCKLIST on purpose: get a blocklist
    # wrong and you pay $2 to review something harmless, get an allowlist wrong and product code
    # merges unreviewed under a green check.
    #
    # That reasoning only applied to an AUTOMATIC trigger, where the workflow had to guess whether a
    # push was worth money. It is now actively harmful: a path filter suppresses the `labeled` event
    # too, so labelling a docs-touching PR would do NOTHING AT ALL — no run, no check, no log, no
    # feedback of any kind. A human who asks for a review and silently gets none is the exact failure
    # class this file exists to prevent. Max pressing the label IS the decision that it is worth $2.
    #
    # If an automatic trigger is ever restored, restore the blocklist with it — and note that
    # '.github/**' was excluded from it on purpose, so a workflow-touching PR still produced a job log.

# If two runs are ever triggered close together, only the newest survives. Cheap insurance: re-labelling
# to re-request a review is exactly the gesture that can double-fire.
concurrency:
  group: code-review-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    # ONE label and one label only. `pull_request: [labeled]` fires for EVERY label added to any PR,
    # so without this gate a routine 'bug' or 'docs' label would quietly cost $2.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'deep-review'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # On the label path the default checkout is already the PR's merge ref. On workflow_dispatch
          # the run starts from the default branch, so the PR has to be named explicitly or the
          # reviewer would read `main` and report that nothing is wrong with it.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || '' }}

      # ══════════════════════════════════════════════════════════════════════════════════════════════
      # ⚠️ THE ANTI-TAMPER GUARD — this is the step that turns the repo's worst failure mode red.
      # ══════════════════════════════════════════════════════════════════════════════════════════════
      #
      # claude-code-action refuses to run when the PR's copy of THIS FILE differs from the copy on the
      # default branch. That refusal is a deliberate security feature — otherwise a PR could rewrite
      # its own reviewer — and it is correct. The problem is what it does next: it logs "Skipping
      # action due to workflow validation" / "Exiting due to workflow validation skip" and then
      # RETURNS SUCCESS. The job goes green in seconds having reviewed nothing. Roughly half of this
      # repo's review runs were this, and from the checks list a skipped review and a clean review are
      # indistinguishable. It is the single worst failure mode this file has.
      #
      # WHY THIS IS A HAND-ROLLED COMPARISON AND NOT A CHECK ON THE ACTION'S OWN OUTPUT
      # (verified 8 Aug 2026 against the v1 tag = v1.0.187 = commit 1623c367, the current release):
      # `src/entrypoints/run.ts` really does call
      #     core.setOutput("skipped_due_to_workflow_validation_mismatch", "true")
      # on that path — that much of the folklore is TRUE. But it sets it on the action's INTERNAL
      # `run` step, and the composite's `outputs:` block re-exports only execution_file, branch_name,
      # github_token, structured_output and session_id. A composite action exposes nothing it has not
      # declared, so `steps.<id>.outputs.skipped_due_to_workflow_validation_mismatch` reads as the
      # EMPTY STRING in this workflow no matter what happened. A conditional built on it would never
      # fire and would look like it was working. Do not "simplify" this step into one.
      # (The action uses the output internally, at action.yml's "Revoke app token" step. Its presence
      # in the source is not evidence it is available to us.)
      #
      # So: fetch the default branch's copy ourselves, compare, and fail loudly. Same comparison the
      # action makes, no dependence on its internals, and it runs BEFORE the action so a doomed run
      # costs nothing instead of $2.
      #
      # ⚠️⚠️ THE PR THAT INTRODUCED THIS STEP WILL TRIP IT. That is not a bug — it is the mechanism
      # working on its first outing. This step lives in the file it compares, so until it exists on
      # `main` every PR carrying it differs from `main` by definition. EXPECT A RED X ON THE FIRST
      # `deep-review` RUN AFTER THIS LANDS, and on any later PR that edits this file at all.
      # HOW TO PROCEED: read the message below, confirm the diff to this workflow is one you meant to
      # make, and MERGE KNOWINGLY — the red X is telling you the truth, that this particular PR got no
      # AI review and needs a human (or the free pre-push `code-review` agent) to be its second reader.
      # Once merged, `main` holds the new copy and subsequent PRs validate normally and go green.
      - name: Fail if the review would be silently skipped
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          WF='.github/workflows/code-review.yml'

          # Raw media type, so this is a byte comparison of file contents — not of git blobs or of
          # anything YAML-aware. The action compares content too, so an inconsequential whitespace
          # change is a genuine mismatch there as well, and must be one here.
          if ! gh api "repos/${REPO}/contents/${WF}?ref=${DEFAULT_BRANCH}" \
                 -H 'Accept: application/vnd.github.raw' > /tmp/code-review-on-default.yml; then
            echo "::error::THIS PR WAS NOT REVIEWED. Could not read ${WF} from '${DEFAULT_BRANCH}'."
            echo "If the file does not exist there yet, the action will refuse to run and exit GREEN."
            exit 1
          fi

          if diff -u /tmp/code-review-on-default.yml "${WF}"; then
            echo "Workflow matches '${DEFAULT_BRANCH}'. The review will actually run."
            exit 0
          fi

          echo
          echo "::error::THIS PR WAS NOT REVIEWED BY CLAUDE. No findings exist. Silence here is not approval."
          cat <<EOF
          ────────────────────────────────────────────────────────────────────────────
          WHY: this PR changes ${WF}, so the PR's copy no longer matches the copy on
          '${DEFAULT_BRANCH}' (the diff is printed above). claude-code-action refuses to
          run in that situation, on purpose, so that a PR cannot rewrite its own
          reviewer. Left to itself the action would have EXITED GREEN having reviewed
          nothing at all, which is why this step exists to fail instead.

          THIS IS CORRECT BEHAVIOUR, NOT A BUG. It is expected on any PR that edits this
          workflow, including the very PR that added this check.

          WHAT TO DO:
            1. Confirm the change to ${WF} is one you meant to make.
            2. Get a human or the free pre-push \`code-review\` agent to read the diff —
               this PR has had no AI review and will not get one.
            3. Merge knowingly. Once this file is on '${DEFAULT_BRANCH}', later PRs that
               leave it alone validate normally and the review runs as usual.
          ────────────────────────────────────────────────────────────────────────────
          EOF
          exit 1

      # ⚠️ PINNED TO A COMMIT, NOT TO `@v1`, AND THE REASON IS NOT PARANOIA — IT IS REQUIRED.
      # Verified 8 Aug 2026 by reading the action's source at each ref:
      #   - `@v1` is a MOVING tag currently pointing at release v1.0.187 (commit 1623c367).
      #   - At that release, `src/modes/detector.ts::validateTrackProgressEvent` accepts
      #     track_progress only for pull_request actions [opened, synchronize, ready_for_review,
      #     reopened]. `labeled` IS NOT IN THAT LIST, and the function THROWS on anything else.
      #   - So `pull_request: [labeled]` + `track_progress: true` on `@v1` crashes in phase 1 with
      #     "track_progress for pull_request events is only supported for actions: ..." and the
      #     label trigger above — the primary mechanism — would never work at all.
      #   - Upstream commit d573b167 ("support labeled action for pull_request events in
      #     track_progress", PR #1586) fixes exactly this. It is merged to main and UNRELEASED:
      #     main is 12 commits ahead of v1.0.187. This SHA is main's head, which contains it.
      # Dropping track_progress instead was the other way out, and it is the wrong one — that is
      # precisely the "runs, finds things, publishes nothing" failure documented below.
      # ⚠️ GO BACK TO A RELEASE TAG once one ≥ v1.0.188 exists containing d573b167. Check with:
      #   gh api repos/anthropics/claude-code-action/contents/src/modes/detector.ts?ref=v1 \
      #     -H 'Accept: application/vnd.github.raw' | grep -A6 'const validActions'
      # If "labeled" appears there, this pin can become `@v1` again in one line.
      - uses: anthropics/claude-code-action@751e0038320253a2f1cb5bb09b03f1d5530847ed # main @ 8 Aug 2026
        id: claude_review
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Deliberately a different model from the one that writes the batches.
          # Same family, so blind spots overlap — but not entirely.
          claude_args: "--model claude-sonnet-4-6"
          # ⚠️ WITHOUT THESE THE REVIEW RUNS AND NOBODY EVER READS IT.
          # Measured on PR #56 (6 Aug 2026): the job ran TWICE — 34 turns then 24,
          # ~$4.30 of plan usage, 30 minutes of wall clock, is_error false,
          # permission_denials_count 0 — and posted nothing. No PR comment, no
          # review, no inline comments, and the log said only
          # "Running Claude Code via SDK (full output hidden for security)".
          # The prompt below tells it to post inline comments plus a summary, but
          # nothing was configured to publish, so its findings went to suppressed
          # stdout and were discarded.
          #
          # This is a DIFFERENT failure from the documented one. A review that is
          # skipped exits green in seconds having done nothing; this one exits
          # green having done the work and thrown it away. Both look identical
          # from the checks list, which is why the rule is to open the log.
          #
          # track_progress puts the result on the PR, where it belongs.
          # show_full_output is the fallback: if the comment ever fails to post,
          # the findings are still in the job log rather than gone. Re-running
          # with `gh run rerun --debug` does NOT substitute for it — that adds the
          # runner's own ##[debug] lines and leaves the SDK output hidden. Tried;
          # it cost $2.23 and told us nothing.
          #
          # ⚠️ WHY THIS IS AN EXPRESSION AND NOT A BARE `true`. `validateTrackProgressEvent`
          # (verified 8 Aug 2026, same function on BOTH `@v1` and main) accepts track_progress
          # only for events [pull_request, issues, issue_comment, pull_request_review_comment,
          # pull_request_review] and THROWS otherwise. `workflow_dispatch` is on no version's
          # list, so a bare `true` would make every manual run crash before reviewing anything.
          # Consequence, stated plainly: on the LABEL path findings are posted to the PR as
          # always; on the MANUAL path the action runs in agent mode with no tracking comment,
          # so `show_full_output` and the prompt's own instruction to post are the only things
          # publishing anything. READ THE JOB LOG AFTER A MANUAL RUN — do not assume silence
          # means a clean review. This is why the label is the primary mechanism and
          # workflow_dispatch is the fallback, not the other way round.
          track_progress: ${{ github.event_name == 'pull_request' }}
          show_full_output: true
          # The first line is added only on the manual path: a workflow_dispatch run carries no
          # PR context at all, so without being told which PR it is, the reviewer has nothing to
          # review. On the label path it renders empty and the prompt below is unchanged.
          prompt: |
            ${{ github.event_name == 'workflow_dispatch' && format('You are reviewing pull request #{0} in the repository {1}. Use the GitHub tools available to you to fetch that PR''s diff, and post your findings on that PR.', inputs.pr_number, github.repository) || '' }}
            Review the diff of this pull request against the base branch.

            You did not write this code. Your job is to find what is wrong with
            it, not to confirm it is fine. You have no stake in it being correct.
            Do not read it charitably. Do not assume something works because it
            is written confidently or because tests pass.

            You have not been told what this change was supposed to do, and you
            should not go looking. Judge whether the code is correct, not
            whether it matches an intent.

            If you find nothing, say so in one line. Do not manufacture findings.
            Do not approve to be agreeable.

            Read the changed lines AND the code they call into and are called
            from. Several of this repo's worst bugs lived in the interaction
            between changed and unchanged code, not in the diff itself.

            PRIORITY ORDER — findings below the line are noise:

            1. WRONG CONDITIONS. A guard that runs but tests the wrong thing.
               Highest value category here. Precedent: a delete guard walked one
               of two reference paths and passed every test written for it; a
               settings write reset the food-cost target to a default on error,
               silently moving every suggested price on the menu.

            2. WRITES THAT DO NOT LAND WHERE CLAIMED. A value assigned in memory
               but never persisted; a link made through a field no xToRow writes.
               Precedent: a dish linked via sp.menuId, which plateToRow omits —
               correct in memory, broken after reload.

            3. SEQUENCING. Cross-referencing writes and deletes are a sequence.
               A row must exist before something references it; dependants go
               before the row they reference. Fire-and-forget in either
               direction is a finding.

            4. SILENT FAILURE. Errors swallowed, failures reporting success,
               empty results indistinguishable from filtered ones. RLS with no
               matching policy returns 200 and an empty array, not an error.

            5. TESTS THAT CANNOT FAIL. A test asserting a function was called,
               where the body could be empty or the condition inverted and it
               would still pass. Found in this repo already. For every guard in
               the diff: does a test fail if the guard's CONDITION is wrong, not
               merely if the guard is absent?

            6. DEAD OR UNREACHABLE CODE. Name-reachability is not enough — a
               function referenced from live code can still be unreachable if
               the argument that triggers it is never passed. Follow the data,
               not the name.

            7. Everything else. Style, naming, formatting. Briefly or not at all.

            THIS REPO'S SPECIFIC TRAPS — check the diff against each:

            - THE NAMING INVERSION. data-tab="ingredients" is the PRODUCTS UI;
              data-tab="pantry" is the INGREDIENTS UI. Code that looks backwards
              is correct; code that looks correct may be backwards.
            - DUPLICATE DEFINITIONS ARE FORBIDDEN. aRow and renderAnalysis were
              each defined twice until v111, and editing the dead first copy
              shipped real bugs. Top-level declarations in one scope, so
              hoisting makes the LAST definition win everywhere, before any
              statement runs — a duplicate is never "dead until reached". Both
              dead copies are deleted and tests/housekeeping.test.js now fails
              if any name in app.js is defined twice. A new duplicate in the
              diff is a finding, not the norm.
            - isFinite('') is TRUE, because Number('') is 0. Gate on
              typeof x !== 'number'. Found twice already.
            - 0 IS A LEGITIMATE PRICE. Never gate on falsiness.
            - THE ROW BOUNDARY. In-memory is camelCase, tables are snake_case
              (plateId vs plate_id). No code outside xToRow/rowToX may name a
              column. A missed field arrives undefined and reads as a missing
              relationship, not an error.
            - THE PARSER REGION in app.js, between `var INV_EXCLUDE=` and
              `function unitLabelFor(`, must stay contiguous and hold only
              extractable pure functions, or the suite cannot reach them.
            - updated_at IS NOT HISTORY. Restore rewrites every timestamp.
            - SIX CACHE-VERSION SPOTS must all agree. Check the count.
            - MIGRATIONS ARE NEVER BUNDLED with the code depending on them. A
              diff assuming a schema change is a finding.

            HOW TO REPORT:

            Post inline comments on the lines you object to, plus one summary.
            For each finding give: severity (critical = wrong data or silent
            loss / major / minor / nit), what breaks as a concrete sequence of
            events, and the check that would settle whether you are right.

            State your confidence in the MECHANISM separately from the finding.
            A finding whose stated cause is wrong can still point at a real bug —
            that has happened twice in this repo and both were worth acting on.
            If you are unsure why something is wrong but confident something is,
            say exactly that.

            Do not rewrite code. Do not modify or re-run tests — read them. Do
            not summarise what the diff does; the author knows. Do not soften a
            critical finding to be diplomatic.
