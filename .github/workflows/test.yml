# Runs your test suite automatically on every push and pull request.
# Free, no API key, no cost. If a change breaks the parser or pricing maths,
# GitHub shows a red X on the commit/PR before it can reach production.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.js
