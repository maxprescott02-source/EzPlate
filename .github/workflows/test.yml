# Runs the checks automatically on every pull request, and on every push to main.
# Free, no API key, no model. If a change breaks the parser, pricing maths, the DOM
# wiring or the dashboard layout, GitHub shows a red X on the PR before it can reach
# production. Mirrors what you run locally.
#
# THREE JOBS ON PURPOSE, so the checks list says WHICH kind of thing broke without
# opening a log:
#   unit        node -c js/app.js + `npm test`        - logic, no browser, no deps
#   smoke       node tests/smoke.js                   - the real index.html + app.js in jsdom
#   playwright  the hermetic tests/visual specs       - the real app in real Chromium
#
# WHY `push` IS SCOPED TO main (changed 8 Aug 2026). The old file had a bare `push:`
# alongside `pull_request:`, so every commit on a PR branch ran the whole workflow
# TWICE - once for the push event, once for the pull_request event - on identical code.
# Adding Playwright made that duplication expensive. PR branches are covered by the
# `pull_request` trigger; main is covered here because a merge to main is a production
# deploy. The one thing you lose is CI on a branch with no PR open yet.
name: tests

on:
  push:
    branches: [main]
  pull_request:

# Superseding a run cancels the older one. Pushing three fixes in five minutes used to
# pay for three full Playwright runs; now only the newest survives. main is exempt -
# every commit that reaches production gets its own recorded result.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------------------
  # Unchanged from the original workflow, deliberately: no npm install, no cache,
  # nothing to go stale. `npm test` is `node --test tests/*.test.js` and needs no
  # dependencies at all, which is why this job finishes in seconds.
  # ---------------------------------------------------------------------------
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check app.js
        run: node -c js/app.js
      - name: Run test suite
        run: npm test

  # ---------------------------------------------------------------------------
  # `node -c` proves app.js PARSES. This proves it RUNS: the script reaches the end
  # of the file against the real index.html, every id the wiring reaches for exists,
  # and the surfaces open and respond.
  #
  # jsdom is installed here rather than added to package.json on purpose - it is a
  # dev-only tool, the header of tests/smoke.js documents exactly this command, and
  # the client ships no new dependencies. --no-save keeps package.json untouched.
  # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD stops npm resolving the existing devDependency
  # and pulling ~400MB of browsers this job will never open.
  # ---------------------------------------------------------------------------
  smoke:
    name: smoke (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Unpinned on purpose, so this matches the command in tests/smoke.js's header
      # exactly and a red run here reproduces locally with one copy-paste. The cost of
      # that choice: a breaking jsdom release turns this job red on a PR that changed
      # nothing. If that ever happens, the tell is that the failure is in jsdom's DOM
      # behaviour rather than in a check the diff touched - pin the version here (it
      # was 30.0.1 on 8 Aug 2026) and queue the real fix.
      - name: Install jsdom (dev-only, not saved)
        run: npm install jsdom --no-save
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Run smoke test
        run: node tests/smoke.js

  # ---------------------------------------------------------------------------
  # The browser specs. These catch the layout and geometry regressions the unit
  # suite cannot see - touch-target floors, grid geometry, chart rendering, the
  # boot gate - because they measure computed styles in real Chromium.
  #
  # WHAT RUNS: every spec in tests/visual EXCEPT screenshots.spec.js. The list is
  # computed from the directory rather than written out, so a new spec is picked up
  # without editing this file.
  #
  # WHY screenshots.spec.js IS EXCLUDED - and must stay excluded:
  #   It is the only spec that does NOT install tests/visual/_boot.js. Every other
  #   spec installs a fake window.supabase serving tests/fixtures/base-products.json
  #   and aborts every off-origin request, so it is hermetic. screenshots.spec.js
  #   instead loads supabase-js from the CDN and reads the cafe's LIVE production
  #   database, so what it renders depends on Max's real data and on the network
  #   being up. It also asserts nothing beyond `body` being visible - its output is
  #   the PNGs in tests/visual/__shots__/, which a human is meant to open and LOOK at.
  #   In CI it would be a slow, network-dependent check that cannot fail usefully and
  #   can fail uselessly. It stays a local tool: `npm run shots`.
  #
  # THE SERVER: playwright.config.js already declares a webServer (python3's built-in
  # http.server on 5173) with a `url`, so Playwright polls that URL and starts the
  # specs the moment it answers. No sleep, and nothing to add here. We do NOT use the
  # `npm run serve` script for this - it shells out to `npx serve@14`, which is one
  # more network fetch on every run for no benefit. python3 is on the runner image.
  # ---------------------------------------------------------------------------
  playwright:
    name: browser specs (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          # Do not let the postinstall pull browsers - the cache step below owns that,
          # and it must fetch Chromium ONLY, not Firefox and WebKit as well.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # Key the browser cache on the exact resolved Playwright version, not on the
      # lockfile hash: a lockfile change that does not move Playwright should still
      # hit the cache, and a Playwright bump must always miss it (the browser build
      # is version-locked to the client).
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.pw.outputs.version }}

      # Chromium only. The config declares no `projects`, so Playwright runs the
      # default chromium project and Firefox/WebKit would be pure download cost.
      - name: Install Chromium + system deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # The browser binary is cached; the apt packages it links against are not, so
      # they have to be reinstalled even on a cache hit. This is the official
      # Playwright pattern and is much cheaper than re-downloading the browser.
      - name: Install system deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Every flag here is set on the COMMAND LINE rather than in playwright.config.js,
      # so `npm run shots` and a local `npx playwright test` behave exactly as they did:
      #
      #   --forbid-only    a `test.only` left in a spec would otherwise run ONE test and
      #                    report the job green - the exact failure mode this exists to stop.
      #   --workers=2      the runner has 2 cores and these specs spend most of their time
      #                    waiting on the page, not on CPU. Measured locally: 2.1 min at 2
      #                    workers vs 3.9 min at 1, for 88 tests.
      #   --trace          the config sets no trace and no screenshot, so without this a red
      #                    run gives you a stack and nothing to look at - useless for the
      #                    layout regressions these specs exist to catch. retain-on-failure
      #                    keeps the trace (with DOM snapshots) only for tests that failed.
      #                    Measured cost of tracing everything: 2.2 min vs 2.1 min.
      #   --retries=1      added 10 Aug 2026, after a batch whose diff was three .md files and
      #                    zero lines of code was failed by a test that died in SETUP before any
      #                    assertion ran - 208 passed, 1 died; re-run on the identical commit,
      #                    209/209 green. (That is run 31368954663, ATTEMPT 1. Note the attempt:
      #                    `gh run list`/`gh run view --json attempt` both report 1 for it, and
      #                    only the REST field `run_attempt` says 2, so a search that trusts the
      #                    CLI concludes the incident never happened.)
      #                    Retries default to 0, so ONE of these fails the whole PR.
      #                    ⚠️ THE MECHANISM THIS COMMENT ORIGINALLY CLAIMED - "one slow
      #                    browser.newContext under load" - IS WRONG, and was disproved by
      #                    measurement on 10 Aug 2026. Nothing is slow: THE BROWSER PROCESS
      #                    CRASHES. All six CI occurrences carry `Received signal 11 SEGV_MAPERR
      #                    0000000001b0` in the browser log, and all six crash at the IDENTICAL
      #                    instruction (binary offset 0x2af9eec, module offset subtracted so it
      #                    survives ASLR), in chrome-headless-shell-1228 / Playwright 1.61.1.
      #                    ⚠️ THE BUMP WAS TRIED AND DID NOT FIX IT, so read those two numbers as
      #                    the ORIGINAL census and not as the affected set. Playwright is now
      #                    1.62.1 and the browser chrome-headless-shell-1234 (Chromium
      #                    151.0.7922.34); a reproducer crashed it 3 times in 150 tight cycles,
      #                    against 2.9% on 1228 - indistinguishable. Do not read a newer build as
      #                    evidence the class is fixed. The mechanism IS now known: a context
      #                    teardown racing the service worker registration that every spec starts
      #                    on window load. A padded arm crashed 0 times in 360 cycles, and fixing
      #                    that in tests/visual/_boot.js is queued.
      #                    Details: docs/handovers/HANDOVER-165-segv-reproducer.md.
      #                    One bug, six times - not a family of crashes.
      #                    `--disable-dev-shm-usage` is already on the launch line above, so the
      #                    usual /dev/shm explanation is excluded.
      #                    The two error strings you will see are ONE event, differing only in
      #                    whether Playwright had noticed the process was gone:
      #                      `browser.newContext: Target page, context or browser has been closed`
      #                      `Test timeout of 30000ms exceeded while setting up "context"`
      #                    The second is 30 seconds spent waiting on a process that is already
      #                    dead - not 30 seconds of context creation.
      #                    So a retry is exactly the right response: a segfault is unambiguously
      #                    infra, it cannot be a regression in the diff, and a fresh worker gets
      #                    a fresh browser. Read `Received signal` in the failure text and you
      #                    have the diagnosis in one grep. Details and the run-by-run census are
      #                    in docs/handovers/HANDOVER-163-browser-segv.md.
      #                    ⚠️ THIS DOES HIDE A CLASS OF REAL FAILURE, and saying otherwise was the
      #                    first draft of this comment - corrected by the pre-push review before
      #                    merge, so read it as the cost being ACCEPTED rather than avoided.
      #                    Playwright cannot tell an infra hiccup from an INTERMITTENT REAL BUG:
      #                    a race or timing regression that fails one run in three - exactly what
      #                    these visual specs exist to catch - presents identically to a slow
      #                    context launch. Fails attempt 1, passes attempt 2, classified `flaky`,
      #                    and THE JOB EXITS 0 AND GOES GREEN. There is no retry-exhaustion-only
      #                    path: if every test eventually passes, the run is a pass.
      #                    So the annotation is the whole safety net, and it only works if someone
      #                    reads it: **a `flaky` annotation on a green check is a FINDING, not
      #                    noise.** Treat it as a defect report against the spec it names.
      #                    (The trace for the failed attempt used to be discarded with the runner
      #                    for the same reason - the upload gate was `if: failure()`. Fixed 10 Aug
      #                    2026; see the detection step below.)
      #                    The alternative considered and REFUSED was raising the global test
      #                    timeout, which would mask a real hang outright and give no annotation
      #                    at all.
      #                    Workers stay at 2, and the reason is better than the old one. That said
      #                    "contention is a plausible cause and it was not measured"; the CAUSE has
      #                    since been identified and contention is not it - a segfault at a fixed
      #                    code offset is not something load produces. (Strictly: parallelism was
      #                    not varied, so this rules contention out by naming the cause, not by
      #                    experiment.) Cutting to 1 worker would roughly double the job - 2.1 min
      #                    vs 3.9 min at 88 tests - to chase something it would not fix.
      # ⚠️ THE EMPTY-LIST CASE MUST FAIL CLOSED, and the obvious one-liner fails OPEN.
      # Inlining `$(ls ... | grep -v ...)` directly as arguments looks fine and is a trap: if the
      # pipeline ever matches nothing, it expands to an EMPTY STRING, and neither `set -e` nor
      # `pipefail` aborts, because the failing pipeline is inside another command's argument list
      # rather than being a statement of its own. `npx playwright test` with no file arguments then
      # falls back to playwright.config.js's own `testDir: './tests/visual'`, which matches EVERY
      # spec in that directory - INCLUDING screenshots.spec.js, the one spec excluded above because
      # it reads the cafe's live production database. So the failure mode is not "runs nothing and
      # goes green"; it is "silently runs the non-hermetic spec in a job documented as hermetic".
      # Latent today (31 specs, 30 survive the filter) - pinned here so it stays that way.
      # (That count read "9 specs, 8 survive" until 10 Aug 2026, was corrected to "22 specs, 21
      # survive" on that date, and had drifted AGAIN to 31/30 by v156 - found stale by three
      # consecutive audits. The GUARD is correct and fails closed; only the number lied.
      # DO NOT hand-correct it a fourth time: `tests/ci-workflow.test.js` now asserts these two
      # numbers against tests/visual/ and fails when they drift, so the suite maintains them.
      # If you reword this line, reword that test's regex in the same change.)
      - name: Run hermetic browser specs
        env:
          # LOAD-BEARING, not tidiness. Without it the `json` reporter writes the ENTIRE report
          # to stdout and buries the github reporter's summary in it. Measured 10 Aug 2026: the
          # path resolves relative to the CONFIG's directory, not the working directory -
          # playwright.config.js is at the repo root, so a bare filename lands at the repo root,
          # which is what the step below reads. A relative path with directories in it will not
          # go where you expect.
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
        run: |
          set -euo pipefail
          SPECS=$(ls tests/visual/*.spec.js | grep -v screenshots.spec.js || true)
          if [ -z "$SPECS" ]; then
            echo "::error::No hermetic browser specs matched. Refusing to run: with no file"
            echo "::error::arguments Playwright would fall back to testDir and pick up"
            echo "::error::screenshots.spec.js, which reads the live production database."
            exit 1
          fi
          echo "Running these specs:"; echo "$SPECS"
          npx playwright test --forbid-only --workers=2 --retries=1 --trace=retain-on-failure --reporter=github,html,json $SPECS

      # WHY THIS STEP EXISTS. With --retries=1 a test that fails once and passes on retry is
      # classified `flaky` and THE JOB EXITS 0, so `failure()` is false and the upload below never
      # fired - while `--trace=retain-on-failure` HAD written the failed attempt's trace, with its
      # DOM snapshot, to test-results/. It was then thrown away with the runner. That is the one
      # run you most want to open: a green-with-flaky run is the only evidence that separates an
      # infra hiccup from an intermittent REAL regression, which is exactly what these specs catch.
      #
      # ⚠️ IT READS stats.flaky, NOT A GREP FOR `"status":"flaky"`. The queue item specified that
      # grep and it matches ZERO times - the JSON reporter pretty-prints, so the literal in the file
      # is `"status": "flaky"`, with a space. A grep for the bare word `flaky` hits 11 times in a
      # one-test report. Both were measured before this was written; the first would have been a
      # gate that looks right and never fires, which is worse than the hole it replaces.
      #
      # It cannot turn a green run red: node parses inside a try/catch and prints 0 for a missing or
      # malformed report, so a broken detector loses the artifact rather than failing the build.
      - name: Did any spec pass only on a retry?
        id: flaky
        if: always()
        run: |
          set -euo pipefail
          COUNT=$(node -e "try{process.stdout.write(String(require('./playwright-results.json').stats.flaky||0))}catch(e){process.stdout.write('0')}")
          if [ "$COUNT" != "0" ]; then
            echo "::warning::$COUNT spec(s) passed only on a retry. A flaky annotation on a green check is a FINDING, not noise - the uploaded report has the trace for the failed attempt."
            echo "flaky=true" >> "$GITHUB_OUTPUT"
          else
            echo "flaky=false" >> "$GITHUB_OUTPUT"
          fi

      # WHY THIS STEP EXISTS. The step above says a spec passed on a retry. It does NOT say the
      # browser process died, so the reader's first hypothesis is a regression in their own diff -
      # the one thing a segfault cannot be. Diagnosing it the first time cost an artifact download,
      # an unzip, a trace parse and a hex subtraction; the evidence is a single string that was in
      # the json report the whole time. See docs/handovers/HANDOVER-163-browser-segv.md.
      #
      # ⚠️ IT MUST NOT GREP THE FILE. `Received signal` also appears in `config.metadata.gitDiff` -
      # Playwright captures the branch diff into the report in CI (only on pull_request, which is
      # this workflow's trigger), and the diff that ADDED this comment contains the string. Measured
      # against the real report from run 31384057429, where it sits at offset 2087 of the gitDiff.
      # A file-wide grep would therefore announce a browser crash on a clean green run of this very
      # batch. So the walk reads ERROR TEXT ONLY, and never the report as a document.
      #
      # ⚠️ THERE ARE TWO ERROR CHANNELS AND READING ONLY THE FIRST LOSES THE CASE MOST WORTH
      # CATCHING. Per-test text - results[].error.message/.stack and results[].errors[].message -
      # covers a crash that lands mid-test, which is all six occurrences on record. A crash that
      # lands BETWEEN tests, in the worker respawn Playwright does after every failure, is reported
      # through the reporter's onError instead and is serialized to the report's own top-level
      # `errors` array (`errors: this._errors` in playwright/lib/runner/index.js) - attributed to
      # no spec at all. That is the case where the reader has least to go on, so it is read too and
      # says plainly that no spec owns it. Found by the pre-push review, verified against the
      # installed reporter source rather than inferred.
      #
      # Fails open exactly like the detector above: node parses inside a try/catch and prints an
      # empty string for a missing or malformed report, so a broken detector loses the WARNING
      # rather than the build. It reports on a red run too, not just a flaky one - a crash that
      # takes both attempts is still infra, and that is the run most likely to be misread.
      #
      # tests/ci-workflow.test.js EXTRACTS THIS SCRIPT AND RUNS IT against a real-derived fixture,
      # so it stays on one line with single quotes only - the extraction ends at the closing double
      # quote. Mis-slice it and the test throws rather than passing quietly.
      - name: Did the browser crash?
        if: always()
        run: |
          set -euo pipefail
          CRASHED=$(node -e "let out='';try{const r=require('./playwright-results.json');const hit=new Set();const txt=o=>[(o||{}).message,(o||{}).stack].join('\n');const sig=t=>String(t).includes('Received signal');const walk=s=>{(s.suites||[]).forEach(walk);(s.specs||[]).forEach(sp=>(sp.tests||[]).forEach(t=>(t.results||[]).forEach(res=>{if(sig([txt(res.error)].concat((res.errors||[]).map(txt)).join('\n')))hit.add(sp.file+':'+sp.line);})));};(r.suites||[]).forEach(walk);(r.errors||[]).forEach(e=>{if(sig(txt(e)))hit.add('a global error, attributed to no spec');});out=Array.from(hit).join(', ');}catch(e){}process.stdout.write(out)")
          if [ -n "$CRASHED" ]; then
            echo "::warning::The browser process CRASHED (SIGSEGV - 'Received signal' in the failure text) during: $CRASHED. This is infra, NOT your diff: a segfault cannot be caused by the code under test. Known Chromium bug in the build shipped with this Playwright version - see docs/handovers/HANDOVER-163-browser-segv.md. Record this occurrence and the test that ran immediately before it."
          fi

      # Failures and flakes only - a fully green run's report is megabytes of nothing, which is why
      # this is not `if: always()`. On a red run it is the difference between "something broke" and
      # opening the trace at the failing assertion; on a flaky one it is the only surviving evidence.
      # Download it and run: npx playwright show-trace <the .zip inside>.
      - name: Upload Playwright report
        if: failure() || steps.flaky.outputs.flaky == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            playwright-results.json
          retention-days: 7
          if-no-files-found: ignore
